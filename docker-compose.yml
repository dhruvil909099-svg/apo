version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ipopro_db
    restart: always
    environment:
      POSTGRES_USER: ipopro_user
      POSTGRES_PASSWORD: ipopro_secure_password
      POSTGRES_DB: ipopro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipopro_user -d ipopro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ipopro_backend
    restart: always
    environment:
      APP_NAME: "Angel One SmartAPI Multi-Account IPO Dashboard"
      TRADING_MODE: "PAPER"
      APP_ENCRYPTION_KEY: "UOq2vBkYP1PnplztDgeVbfI3UTQvdREy-EsbYI0g3C4="
      DATABASE_URL: "postgresql://ipopro_user:ipopro_secure_password@db:5432/ipopro_db"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ipopro_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

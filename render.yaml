services:
  - type: web
    name: ipopro-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false  # Supply Hostinger MySQL URL: mysql+pymysql://<user>:<password>@<host>:3306/<database>?charset=utf8mb4
      - key: APP_ENCRYPTION_KEY
        sync: false  # Preserve existing UOq2vBkYP1PnplztDgeVbfI3UTQvdREy-EsbYI0g3C4= master key
      - key: TRADING_MODE
        value: PAPER
      - key: REQUIRE_AUTH
        value: "true"
      - key: MASTER_API_KEY
        sync: false  # Optional server-to-server key; if unset, master key bypass is disabled
      - key: JWT_SECRET_KEY
        sync: false  # Secret key for signing user session JWT tokens
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://ipo.emperialcabs.com"
      - key: SMARTAPI_API_KEY
        sync: false
      - key: SMARTAPI_CLIENT_CODE
        sync: false
      - key: SMARTAPI_PIN
        sync: false
      - key: SMARTAPI_TOTP_SECRET
        sync: false

